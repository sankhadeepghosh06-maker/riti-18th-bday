<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Draw Your Heart 🎨</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  padding: 25px 15px 50px;

  background:
    radial-gradient(
      circle at top,
      rgba(255,80,140,.18),
      transparent 45%
    ),
    #09050a;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;
}

.container {
  width: 100%;
  max-width: 700px;

  margin: auto;
}

h1 {
  font-family: Georgia, serif;

  font-size: clamp(40px, 10vw, 65px);
}

canvas {
  display: block;

  width: 100%;
  height: 400px;

  margin: 25px auto;

  border-radius: 25px;

  background: #fff9fb;

  cursor: crosshair;

  touch-action: none;
}

.controls {
  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 10px;
}

button {
  padding: 12px 18px;

  border: 1px solid rgba(255,180,200,.2);

  border-radius: 999px;

  background: rgba(255,255,255,.06);

  color: white;

  cursor: pointer;
}

.color {
  width: 42px;
  height: 42px;

  padding: 0;

  border-radius: 50%;
}

.back {
  display: inline-block;

  margin-top: 30px;

  color: white;

  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

<h1>
🎨 Draw Your Heart
</h1>

<p>
Draw something for the birthday girl.
</p>


<canvas id="canvas"></canvas>


<div class="controls">

<button
  class="color"
  style="background:#ff477e"
  onclick="setColor('#ff477e')">
</button>

<button
  class="color"
  style="background:#d94f79"
  onclick="setColor('#d94f79')">
</button>

<button
  class="color"
  style="background:#9b59b6"
  onclick="setColor('#9b59b6')">
</button>

<button
  class="color"
  style="background:#333"
  onclick="setColor('#333')">
</button>

<button onclick="clearCanvas()">
Clear
</button>

</div>


<a href="mini-games.html" class="back">
← Back to Mini Games
</a>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let drawing = false;

let color = "#ff477e";

let brushSize = 5;


function resizeCanvas() {

const rect =
canvas.getBoundingClientRect();

const ratio =
window.devicePixelRatio || 1;

canvas.width =
rect.width * ratio;

canvas.height =
rect.height * ratio;

ctx.scale(ratio, ratio);

ctx.lineCap = "round";
ctx.lineJoin = "round";

}


resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


function position(event) {

const rect =
canvas.getBoundingClientRect();

return {

x: event.clientX - rect.left,

y: event.clientY - rect.top

};

}


canvas.addEventListener(
"pointerdown",
event => {

drawing = true;

const p = position(event);

ctx.beginPath();

ctx.moveTo(p.x, p.y);

}
);


canvas.addEventListener(
"pointermove",
event => {

if (!drawing) return;

const p = position(event);

ctx.strokeStyle = color;

ctx.lineWidth = brushSize;

ctx.lineTo(p.x, p.y);

ctx.stroke();

}
);


canvas.addEventListener(
"pointerup",
() => {

drawing = false;

ctx.closePath();

}
);


canvas.addEventListener(
"pointerleave",
() => {

drawing = false;

}
);


function setColor(newColor) {

color = newColor;

}


function clearCanvas() {

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}

</script>

</body>

</html>
