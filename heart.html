<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Draw Your Heart 🎨</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;

background:
radial-gradient(circle at 50% 20%,rgba(180,90,255,.15),transparent 40%),
#100818;

color:white;

font-family:Arial,sans-serif;

text-align:center;

padding:30px 15px;
}

.back {
display:block;
margin-bottom:35px;
color:#c5b0ca;
font-size:11px;
text-decoration:none;
}

h1 {
font-family:Georgia,serif;
font-size:48px;
font-weight:400;
}

p {
color:#c5b0ca;
font-size:12px;
}

.canvas-wrap {
width:min(100%,500px);
margin:30px auto;
padding:10px;

border-radius:20px;

background:
linear-gradient(
135deg,
rgba(255,100,190,.1),
rgba(130,80,255,.1)
);

border:1px solid rgba(255,255,255,.12);
}

canvas {
display:block;
width:100%;
height:auto;
aspect-ratio:1;

background:#160d1c;
border-radius:13px;

touch-action:none;
}

.controls {
margin-top:15px;
display:flex;
justify-content:center;
gap:10px;
}

button {
padding:11px 17px;
border-radius:999px;
border:1px solid rgba(255,170,220,.3);
background:rgba(255,255,255,.05);
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<a href="mini-games.html" class="back">
← back to the games
</a>

<h1>
Draw Your Heart ♡
</h1>

<p>
Draw something only you would understand.
</p>

<div class="canvas-wrap">

<canvas id="canvas" width="600" height="600"></canvas>

</div>

<div class="controls">

<button onclick="clearCanvas()">
clear
</button>

<button onclick="surprise()">
surprise
</button>

</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let drawing = false;

ctx.lineWidth = 7;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.strokeStyle = "#ff8fc9";

function position(e) {

const rect =
canvas.getBoundingClientRect();

const point =
e.touches ? e.touches[0] : e;

return {

x:(point.clientX - rect.left)
* canvas.width / rect.width,

y:(point.clientY - rect.top)
* canvas.height / rect.height

};

}

function start(e) {

drawing = true;

const p = position(e);

ctx.beginPath();

ctx.moveTo(p.x,p.y);

}

function move(e) {

if(!drawing) return;

e.preventDefault();

const p = position(e);

ctx.lineTo(p.x,p.y);

ctx.stroke();

}

function end() {

drawing = false;

}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);
canvas.addEventListener("mouseleave",end);

canvas.addEventListener("touchstart",start,{passive:false});
canvas.addEventListener("touchmove",move,{passive:false});
canvas.addEventListener("touchend",end);

function clearCanvas() {

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}

function surprise() {

clearCanvas();

ctx.font = "120px serif";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.fillStyle = "#ff8fc9";

ctx.fillText(
"♡",
canvas.width / 2,
canvas.height / 2
);

}

</script>

</body>
</html>
