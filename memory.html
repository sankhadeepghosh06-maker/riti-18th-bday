<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Memory Match 🧠</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  padding: 25px 15px;

  background:
    radial-gradient(
      circle at top,
      rgba(255,80,140,.18),
      transparent 45%
    ),
    #09050a;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;
}

.container {
  max-width: 650px;

  margin: auto;
}

h1 {
  font-family: Georgia, serif;

  font-size: clamp(40px, 10vw, 60px);
}

#status {
  color: #ffabc0;

  margin-bottom: 20px;
}

.board {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;
}

.card {
  aspect-ratio: 1;

  border-radius: 15px;

  background: #351321;

  border: 1px solid rgba(255,180,200,.2);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 35px;

  cursor: pointer;

  transition: transform .2s;
}

.card:hover {
  transform: scale(1.04);
}

.card.flipped,
.card.matched {
  background: #713148;
}

.back {
  display: inline-block;

  margin-top: 30px;

  color: white;

  text-decoration: none;
}

#restart {
  margin-top: 20px;

  padding: 12px 20px;

  border: none;

  border-radius: 999px;

  background: #d94f79;

  color: white;

  cursor: pointer;
}

@media (max-width: 420px) {

  .board {
    gap: 7px;
  }

  .card {
    font-size: 28px;
  }

}

</style>

</head>

<body>

<div class="container">

<h1>
🧠 Memory Match
</h1>

<div id="status">
Find all the pairs ❤️
</div>

<div id="board" class="board"></div>

<button id="restart" onclick="startGame()">
Restart Game
</button>

<br>

<a href="mini-games.html" class="back">
← Back to Mini Games
</a>

</div>


<script>

const symbols = [
"❤️","❤️",
"🌹","🌹",
"⭐","⭐",
"🎀","🎀",
"🌸","🌸",
"🎵","🎵",
"🦋","🦋",
"💌","💌"
];

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let matched = 0;


function shuffle(array) {

return array
.sort(() => Math.random() - 0.5);

}


function startGame() {

const board =
document.getElementById("board");

board.innerHTML = "";

firstCard = null;
secondCard = null;
lockBoard = false;
matched = 0;

document.getElementById("status")
.textContent =
"Find all the pairs ❤️";

shuffle(symbols).forEach(symbol => {

const card =
document.createElement("div");

card.className = "card";

card.dataset.symbol = symbol;

card.textContent = "?";

card.addEventListener(
"click",
() => flipCard(card)
);

board.appendChild(card);

});

}


function flipCard(card) {

if (
lockBoard ||
card === firstCard ||
card.classList.contains("matched")
) {
return;
}

card.classList.add("flipped");

card.textContent =
card.dataset.symbol;

if (!firstCard) {

firstCard = card;

return;

}

secondCard = card;

checkMatch();

}


function checkMatch() {

if (
firstCard.dataset.symbol ===
secondCard.dataset.symbol
) {

firstCard.classList.add("matched");

secondCard.classList.add("matched");

matched += 2;

resetCards();

if (matched === symbols.length) {

document.getElementById("status")
.textContent =
"🎉 You found them all! Happy 18th, Riti ❤️";

}

} else {

lockBoard = true;

setTimeout(() => {

firstCard.classList.remove("flipped");

secondCard.classList.remove("flipped");

firstCard.textContent = "?";
secondCard.textContent = "?";

resetCards();

}, 800);

}

}


function resetCards() {

firstCard = null;
secondCard = null;
lockBoard = false;

}


startGame();

</script>

</body>

</html>
