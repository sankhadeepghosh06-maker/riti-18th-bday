<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Match 🧠</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;
padding:30px 15px;
background:
radial-gradient(circle at 50% 20%,rgba(170,90,255,.15),transparent 40%),
#100818;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

.back {
display:block;
margin-bottom:35px;
color:#c5b2ca;
font-size:11px;
text-decoration:none;
}

h1 {
font-family:Georgia,serif;
font-weight:400;
font-size:46px;
}

p {
color:#c5b2ca;
font-size:12px;
}

.board {
width:min(100%,420px);
margin:30px auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.card {
aspect-ratio:1;
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
background:linear-gradient(135deg,#24152e,#171020);
display:grid;
place-items:center;
font-size:30px;
cursor:pointer;
transition:.3s;
}

.card.flipped,
.card.matched {
background:linear-gradient(135deg,#5b3264,#493275);
transform:scale(.97);
}

.card.matched {
box-shadow:0 0 20px rgba(255,100,190,.15);
}

#status {
min-height:30px;
color:#ffb7dc;
}

button {
padding:12px 20px;
border-radius:999px;
border:1px solid rgba(255,170,220,.3);
background:rgba(255,255,255,.05);
color:white;
}

</style>

</head>

<body>

<a href="mini-games.html" class="back">← back to the games</a>

<h1>Memory Match</h1>

<p>Find all the pairs. 💗</p>

<div id="status">0 / 4 pairs</div>

<div class="board" id="board"></div>

<button onclick="startGame()">restart</button>

<script>

const symbols = ["💗","🌸","🎀","✨"];

let cards = [];
let flipped = [];
let matches = 0;

function startGame() {

cards = [...symbols,...symbols]
.sort(() => Math.random() - .5);

flipped = [];
matches = 0;

const board = document.getElementById("board");

board.innerHTML = "";

cards.forEach((symbol,index) => {

const card = document.createElement("div");

card.className = "card";
card.dataset.symbol = symbol;
card.dataset.index = index;

card.textContent = "♡";

card.onclick = () => flip(card);

board.appendChild(card);

});

updateStatus();

}

function flip(card) {

if(
flipped.length === 2 ||
card.classList.contains("flipped") ||
card.classList.contains("matched")
) return;

card.classList.add("flipped");
card.textContent = card.dataset.symbol;

flipped.push(card);

if(flipped.length === 2) {

setTimeout(checkMatch,500);

}

}

function checkMatch() {

const [a,b] = flipped;

if(a.dataset.symbol === b.dataset.symbol) {

a.classList.add("matched");
b.classList.add("matched");

matches++;

} else {

a.classList.remove("flipped");
b.classList.remove("flipped");

a.textContent = "♡";
b.textContent = "♡";

}

flipped = [];

updateStatus();

}

function updateStatus() {

document.getElementById("status").textContent =
`${matches} / 4 pairs`;

if(matches === 4) {

document.getElementById("status").textContent =
"you did it. 💗";

}

}

startGame();

</script>

</body>
</html>
