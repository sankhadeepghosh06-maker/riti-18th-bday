<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Little Love Room 🏠</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #33101f,
      #09050a 60%
    );

  color: white;

  font-family: Arial, sans-serif;

  padding: 20px;
}

.container {
  width: 100%;
  max-width: 700px;

  margin: auto;

  text-align: center;
}

h1 {
  font-family: Georgia, serif;

  font-size: clamp(38px, 9vw, 60px);
}

.room {
  position: relative;

  width: 100%;

  max-width: 650px;

  height: 420px;

  margin: 25px auto;

  border-radius: 30px;

  overflow: hidden;

  background:
    linear-gradient(
      #24101b 0 70%,
      #4d2933 70% 100%
    );

  border: 2px solid rgba(255,180,200,.15);
}

.window {
  position: absolute;

  top: 45px;
  left: 50%;

  transform: translateX(-50%);

  width: 150px;
  height: 110px;

  border: 8px solid #754451;

  background:
    radial-gradient(circle, #ff9ab8, #401526);
}

.couch {
  position: absolute;

  bottom: 70px;
  left: 50%;

  transform: translateX(-50%);

  width: 230px;
  height: 75px;

  border-radius: 30px 30px 15px 15px;

  background: #8b4058;
}

.lamp {
  position: absolute;

  right: 60px;
  bottom: 75px;

  font-size: 60px;
}

.character {
  position: absolute;

  bottom: 125px;
  left: 50%;

  transform: translateX(-50%);

  font-size: 75px;

  cursor: pointer;

  transition: transform .2s;
}

.character:hover {
  transform:
    translateX(-50%)
    scale(1.1);
}

.controls {
  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 10px;
}

button {
  padding: 13px 18px;

  border: 1px solid rgba(255,180,200,.25);

  border-radius: 999px;

  background: rgba(255,255,255,.05);

  color: white;

  cursor: pointer;
}

.message {
  min-height: 50px;

  margin: 20px;

  color: #ffabc0;

  font-family: Georgia, serif;

  font-size: 21px;
}

.back {
  display: inline-block;

  margin-top: 20px;

  color: white;

  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

<h1>🏠 Little Love Room</h1>

<p>
Welcome to your tiny little world.
</p>

<div class="room">

<div class="window"></div>

<div class="couch"></div>

<div class="lamp">
💡
</div>

<div
  id="character"
  class="character"
  onclick="pokeCharacter()"
>
🐻
</div>

</div>


<div class="controls">

<button onclick="saySomething()">
💬 Talk
</button>

<button onclick="giveHug()">
🤗 Hug
</button>

<button onclick="dance()">
💃 Dance
</button>

<button onclick="giveFlower()">
🌹 Give Flower
</button>

</div>


<div id="message" class="message">
Your tiny companion is waiting...
</div>


<a href="mini-games.html" class="back">
← Back to Mini Games
</a>

</div>


<script>

const messages = [

"Your tiny companion says: you are adorable. ❤️",

"🐻 says: I hope you're having the best birthday.",

"Someone clearly loves you very much.",

"Emergency hug incoming. 🤗",

"You're officially 18 levels more fabulous.",

"Don't forget to smile today. ❤️"

];


function showMessage(text) {

document.getElementById("message")
.textContent = text;

}


function pokeCharacter() {

showMessage(
messages[
Math.floor(Math.random() * messages.length)
]
);

}


function saySomething() {

showMessage(
"🐻: If nobody told you today... you're pretty amazing."
);

}


function giveHug() {

showMessage(
"🐻 gives you the biggest tiny hug. 🤗❤️"
);

}


function dance() {

const character =
document.getElementById("character");

character.textContent = "🕺";

showMessage(
"🐻 is absolutely destroying the dance floor."
);

setTimeout(() => {

character.textContent = "🐻";

}, 1200);

}


function giveFlower() {

showMessage(
"🌹 You gave your tiny companion a flower. It is very happy."
);

}

</script>

</body>

</html>
