<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Love Room 🏠</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% 30%,rgba(185,100,255,.16),transparent 40%),
#100818;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
padding:25px;
}

.room {
width:min(100%,500px);
text-align:center;
}

.back {
display:block;
margin-bottom:25px;
color:#c9b4ce;
font-size:11px;
text-decoration:none;
}

h1 {
font-family:Georgia,serif;
font-size:42px;
font-weight:400;
}

.sub {
color:#c9b4ce;
font-size:12px;
line-height:1.7;
}

.house {
position:relative;
height:320px;
margin:35px auto;
border:1px solid rgba(255,255,255,.12);
border-radius:25px;
overflow:hidden;
background:
linear-gradient(#21132f 0 60%,#171021 60%);
box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.moon {
position:absolute;
right:40px;
top:30px;
font-size:45px;
}

.window {
position:absolute;
left:35px;
top:65px;
width:100px;
height:110px;
border-radius:10px;
background:
linear-gradient(135deg,#ff9fd7,#9168ff);
box-shadow:0 0 40px rgba(255,120,200,.25);
}

.couch {
position:absolute;
bottom:45px;
left:50%;
transform:translateX(-50%);
width:220px;
height:75px;
border-radius:25px 25px 10px 10px;
background:#58365f;
}

.bear {
position:absolute;
bottom:95px;
left:50%;
transform:translateX(-50%);
font-size:75px;
cursor:pointer;
transition:.3s;
}

.bear:hover {
transform:translateX(-50%) scale(1.08);
}

.lamp {
position:absolute;
right:45px;
bottom:45px;
font-size:55px;
}

.message {
min-height:45px;
font-family:Georgia,serif;
font-size:20px;
color:#ffb7dc;
}

button {
padding:12px 20px;
border-radius:999px;
border:1px solid rgba(255,170,220,.3);
background:rgba(255,255,255,.05);
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="room">

<a href="mini-games.html" class="back">← back to the games</a>

<h1>Little Love Room 🏠</h1>

<p class="sub">
Someone tiny lives here.<br>
Tap them.
</p>

<div class="house">

<div class="moon">☾</div>

<div class="window"></div>

<div class="couch"></div>

<div class="bear" onclick="talk()">
🐻
</div>

<div class="lamp">
💡
</div>

</div>

<div class="message" id="message">
...
</div>

<br>

<button onclick="talk()">
talk to the bear
</button>

</div>

<script>

const messages = [

"hi riti ♡",

"you look very birthday-ish today.",

"i have something to tell you...",

"you're very very loved.",

"okay that's all. i'm shy now. 🐻"

];

let index = 0;

function talk() {

document.getElementById("message").textContent =
messages[index];

index++;

if(index >= messages.length) {
index = 0;
}

}

</script>

</body>
</html>
