<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>💗 Our Memories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      background: #111;
      text-align: center;
      padding-bottom: 35px;
    }

    /* Main picture */
    .main-photo {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Instagram Highlight */
    .highlight-link {
      display: inline-block;
      margin-top: 25px;
      padding: 4px;
      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );

      transition: transform 0.25s ease;
    }

    .highlight-link:hover {
      transform: scale(1.1);
    }

    .highlight {
      width: 90px;
      height: 90px;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #111;
    }

    .instagram-text {
      color: white;
      margin-top: 10px;
      font-size: 14px;
    }

    /* Optional button */
    .instagram-button {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 25px;

      background: white;
      color: black;

      text-decoration: none;
      font-weight: bold;

      transition: 0.2s;
    }

    .instagram-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- YOUR IMAGE -->
    <img
      src="photo.png"
      class="main-photo"
      alt="Our memories"
    >

    <!-- INSTAGRAM HIGHLIGHT -->
    <!-- REPLACE THE URL BELOW -->
    <a
      href="https://www.instagram.com/"
      class="highlight-link"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="photo.png"
        class="highlight"
        alt="Instagram"
      >
    </a>

    <div class="instagram-text">
      Instagram 💗
    </div>

    <!-- OPTIONAL INSTAGRAM BUTTON -->
    <a
      href="https://www.instagram.com/stories/highlights/17926944879204043/"
      class="instagram-button"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open Instagram
    </a>

  </div>

</body>
</html>
