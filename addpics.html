<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Memories ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #100818;
      --bg-deep: #09050e;

      --purple: #9a6cff;
      --purple-light: #cdb8ff;

      --pink: #ff73b7;
      --pink-light: #ffb9df;

      --white: #fff8fd;
      --muted: #cbb8d0;

      --border: rgba(255,255,255,0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 30px 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(154,108,255,0.22),
          transparent 32%
        ),

        radial-gradient(
          circle at 85% 80%,
          rgba(255,115,183,0.18),
          transparent 32%
        ),

        linear-gradient(
          145deg,
          var(--bg),
          var(--bg-deep)
        );

      color: var(--white);
      font-family: "DM Sans", sans-serif;

      overflow-x: hidden;
    }

    .page {
      width: min(700px, 100%);
      padding: 38px 26px;

      border: 1px solid var(--border);
      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        );

      box-shadow:
        0 35px 100px rgba(0,0,0,0.45);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      text-align: center;
    }

    .heart {
      width: 64px;
      height: 64px;

      margin: 0 auto 22px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      color: white;
      font-size: 1.8rem;

      background:
        linear-gradient(
          145deg,
          var(--pink),
          #bd4c99
        );

      box-shadow:
        0 12px 35px rgba(255,115,183,0.25);
    }

    .eyebrow {
      margin-bottom: 10px;

      color: var(--pink-light);

      text-transform: uppercase;
      letter-spacing: 0.22em;

      font-size: 0.65rem;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;

      font-size: clamp(3rem, 12vw, 5rem);

      font-weight: 500;
      line-height: 0.9;
    }

    h1 span {
      color: var(--purple-light);
      font-style: italic;
    }

    .intro {
      max-width: 500px;

      margin: 22px auto 30px;

      color: var(--muted);

      font-size: 0.88rem;
      line-height: 1.7;
    }

    .upload-area {
      display: block;

      width: 100%;

      padding: 45px 20px;

      border:
        1px dashed
        rgba(255,115,183,0.45);

      border-radius: 22px;

      background:
        rgba(255,115,183,0.045);

      cursor: pointer;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
    }

    .upload-area:hover {
      transform: translateY(-3px);

      background:
        rgba(255,115,183,0.08);

      border-color:
        rgba(255,115,183,0.75);
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 13px;
    }

    .upload-area strong {
      display: block;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 1.5rem;
    }

    .upload-area small {
      display: block;

      margin-top: 7px;

      color: var(--muted);

      font-size: 0.7rem;
    }

    #fileInput {
      display: none;
    }

    .preview-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;

      margin-top: 20px;
    }

    .preview {
      position: relative;

      aspect-ratio: 1;

      overflow: hidden;

      border-radius: 15px;

      border:
        1px solid
        var(--border);

      background:
        rgba(255,255,255,0.05);
    }

    .preview img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .preview-remove {
      position: absolute;

      top: 7px;
      right: 7px;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      color: white;

      background:
        rgba(0,0,0,0.65);

      cursor: pointer;
    }

    .upload-button {
      width: 100%;

      margin-top: 20px;

      padding: 17px;

      border: none;
      border-radius: 15px;

      color: white;

      font-family:
        "DM Sans",
        sans-serif;

      font-weight: 700;
      font-size: 0.82rem;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          var(--pink),
          #bd4c99
        );

      box-shadow:
        0 12px 30px
        rgba(255,115,183,0.18);

      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .upload-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .upload-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      min-height: 25px;

      margin-top: 15px;

      color: var(--muted);

      font-size: 0.72rem;

      line-height: 1.5;
    }

    .status.success {
      color: var(--pink-light);
    }

    .status.error {
      color: #ff9dca;
    }

    .back-link {
      display: inline-block;

      margin-top: 25px;

      color: var(--muted);

      text-decoration: none;

      font-size: 0.72rem;

      transition:
        color 0.2s ease;
    }

    .back-link:hover {
      color: var(--pink-light);
    }

    .debug {
      margin-top: 12px;

      padding: 10px;

      border-radius: 10px;

      background:
        rgba(255,255,255,0.04);

      color:
        rgba(255,255,255,0.45);

      font-size: 0.62rem;

      line-height: 1.5;

      word-break: break-word;

      display: none;
    }

    .debug.show {
      display: block;
    }

    @media (max-width: 550px) {

      .page {
        padding: 32px 17px;
        border-radius: 24px;
      }

      .preview-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

  </style>

</head>

<body>

  <main class="page">

    <div class="heart">
      ♡
    </div>

    <p class="eyebrow">
      our little collection
    </p>

    <h1>
      Add some
      <span>memories.</span>
    </h1>

    <p class="intro">
      Choose the pictures you want to add.
      They'll appear on Riti's birthday page
      automatically.
    </p>

    <label
      class="upload-area"
      for="fileInput"
    >

      <div class="upload-icon">
        📸
      </div>

      <strong>
        Choose pictures
      </strong>

      <small>
        You can select multiple photos at once
      </small>

    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

    <div
      class="preview-grid"
      id="previewGrid"
    ></div>

    <button
      class="upload-button"
      id="uploadButton"
      disabled
    >
      Upload Memories ♡
    </button>

    <div
      class="status"
      id="status"
    ></div>

    <div
      class="debug"
      id="debug"
    ></div>

    <a
      class="back-link"
      href="index.html"
    >
      ← Back to Riti's birthday
    </a>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =================================================
       SUPABASE CONFIG
       REPLACE THESE TWO VALUES
    ================================================= */

const SUPABASE_URL =
  "https://gedmzmvuzifqrzmarknh.supabase.co/rest/v1/";

const SUPABASE_ANON_KEY =
  "sb_publishable_V_Lg9lEjfA_t6TBRROu6sg_kps8oQup";

    const SUPABASE_BUCKET =
      "birthday-photos";


    /* =================================================
       PASSWORD GATE
    ================================================= */

    const hasAccess =
      sessionStorage.getItem("addpicsAccess");

    if (hasAccess !== "true") {

      const password =
        prompt("Enter the upload password:");

      if (password === "addpics") {

        sessionStorage.setItem(
          "addpicsAccess",
          "true"
        );

      } else {

        window.location.href =
          "index.html";

      }

    }


    /* =================================================
       CHECK CONFIG
    ================================================= */

    if (
      SUPABASE_URL.includes("YOUR_") ||
      SUPABASE_ANON_KEY.includes("YOUR_")
    ) {

      document.getElementById("status").className =
        "status error";

      document.getElementById("status").textContent =
        "Supabase isn't connected yet.";

      document.getElementById("debug").className =
        "debug show";

      document.getElementById("debug").textContent =
        "Replace SUPABASE_URL and SUPABASE_ANON_KEY in addpics.html with your real Supabase Project URL and Publishable/Anon key.";

      throw new Error(
        "Supabase credentials have not been configured."
      );

    }


    /* =================================================
       CREATE SUPABASE CLIENT
    ================================================= */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =================================================
       DOM
    ================================================= */

    const fileInput =
      document.getElementById("fileInput");

    const previewGrid =
      document.getElementById("previewGrid");

    const uploadButton =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    const debug =
      document.getElementById("debug");


    let selectedFiles = [];


    /* =================================================
       FILE SELECTION
    ================================================= */

    fileInput.addEventListener(
      "change",
      () => {

        const files =
          Array.from(fileInput.files);

        const maxSize =
          6 * 1024 * 1024;

        const validFiles = [];

        const rejectedFiles = [];

        files.forEach(file => {

          if (!file.type.startsWith("image/")) {

            rejectedFiles.push(
              file.name + " is not an image."
            );

            return;

          }

          if (file.size > maxSize) {

            rejectedFiles.push(
              file.name + " is larger than 6 MB."
            );

            return;

          }

          validFiles.push(file);

        });


        selectedFiles =
          validFiles;


        renderPreviews();


        if (rejectedFiles.length > 0) {

          status.className =
            "status error";

          status.textContent =
            rejectedFiles.join(" ");

        } else {

          status.className =
            "status";

          status.textContent =
            selectedFiles.length +
            " photo(s) ready to upload ♡";

        }

      }
    );


    /* =================================================
       PREVIEWS
    ================================================= */

    function renderPreviews() {

      previewGrid.innerHTML = "";

      uploadButton.disabled =
        selectedFiles.length === 0;


      selectedFiles.forEach(
        (file, index) => {

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "preview";


          const image =
            document.createElement("img");


          const reader =
            new FileReader();


          reader.onload = () => {

            image.src =
              reader.result;

          };


          reader.readAsDataURL(file);


          const removeButton =
            document.createElement("button");


          removeButton.type =
            "button";

          removeButton.className =
            "preview-remove";

          removeButton.textContent =
            "×";


          removeButton.addEventListener(
            "click",
            () => {

              selectedFiles.splice(
                index,
                1
              );

              renderPreviews();

              status.textContent =
                selectedFiles.length +
                " photo(s) ready to upload ♡";

            }
          );


          wrapper.appendChild(image);

          wrapper.appendChild(
            removeButton
          );

          previewGrid.appendChild(
            wrapper
          );

        }
      );

    }


    /* =================================================
       UPLOAD BUTTON
    ================================================= */

    uploadButton.addEventListener(
      "click",
      uploadPhotos
    );


    /* =================================================
       UPLOAD PHOTOS
    ================================================= */

    async function uploadPhotos() {

      if (selectedFiles.length === 0) {
        return;
      }


      uploadButton.disabled =
        true;


      status.className =
        "status";

      debug.className =
        "debug";


      let successful = 0;

      const total =
        selectedFiles.length;


      for (
        let i = 0;
        i < total;
        i++
      ) {

        const file =
          selectedFiles[i];


        status.textContent =
          "Uploading " +
          (i + 1) +
          " of " +
          total +
          "... ♡";


        try {

          /* -----------------------------------------
             CREATE UNIQUE FILE NAME
          ----------------------------------------- */

          const extension =
            file.name.includes(".")
              ? file.name
                  .split(".")
                  .pop()
                  .toLowerCase()
              : "jpg";


          const uniqueName =
            crypto.randomUUID() +
            "-" +
            Date.now() +
            "." +
            extension;


          const path =
            "gallery/" +
            uniqueName;


          /* -----------------------------------------
             UPLOAD TO STORAGE
          ----------------------------------------- */

          const {
            error: uploadError
          } =
            await supabaseClient
              .storage
              .from(SUPABASE_BUCKET)
              .upload(
                path,
                file,
                {
                  cacheControl: "3600",
                  contentType: file.type,
                  upsert: false
                }
              );


          if (uploadError) {

            console.error(
              "STORAGE ERROR:",
              uploadError
            );

            throw new Error(
              "Storage upload failed: " +
              uploadError.message
            );

          }


          /* -----------------------------------------
             SAVE PATH TO DATABASE
          ----------------------------------------- */

          const {
            error: databaseError
          } =
            await supabaseClient
              .from("photos")
              .insert({
                path: path
              });


          if (databaseError) {

            console.error(
              "DATABASE ERROR:",
              databaseError
            );

            throw new Error(
              "Database save failed: " +
              databaseError.message
            );

          }


          successful++;


        } catch (error) {

          console.error(
            "PHOTO UPLOAD ERROR:",
            error
          );


          status.className =
            "status error";

          status.textContent =
            error.message;


          debug.className =
            "debug show";

          debug.textContent =
            "Open your browser console (F12 → Console) for more details.";

        }

      }


      /* =================================================
         FINAL RESULT
      ================================================= */

      if (successful === total) {

        status.className =
          "status success";

        status.textContent =
          "♡ All " +
          successful +
          " memories are now part of the gallery!";


        selectedFiles = [];

        fileInput.value = "";

        renderPreviews();


      } else if (successful > 0) {

        status.className =
          "status success";

        status.textContent =
          successful +
          " of " +
          total +
          " photos uploaded successfully ♡";


        selectedFiles = [];

        fileInput.value = "";

        renderPreviews();


      } else {

        status.className =
          "status error";

        status.textContent =
          "No photos were uploaded.";

      }


      uploadButton.disabled =
        selectedFiles.length === 0;

    }

  </script>

</body>

</html>
