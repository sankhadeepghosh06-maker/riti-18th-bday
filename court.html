<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Court of Love ⚖️</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  padding: 25px 15px 50px;

  background:
    radial-gradient(
      circle at top,
      rgba(255,100,150,.18),
      transparent 45%
    ),
    #09050a;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;
}

.container {
  max-width: 700px;

  margin: auto;
}

h1 {
  font-family: Georgia, serif;

  font-size: clamp(40px, 10vw, 65px);
}

.court {
  margin-top: 30px;

  padding: 30px;

  border-radius: 25px;

  background: rgba(255,255,255,.05);

  border: 1px solid rgba(255,180,200,.15);
}

.gavel {
  font-size: 70px;
}

.charge {
  margin: 20px 0;

  padding: 20px;

  border-radius: 18px;

  background: rgba(255,255,255,.05);

  text-align: left;
}

.charge strong {
  color: #ffabc0;
}

button {
  margin-top: 20px;

  padding: 15px 25px;

  border: none;

  border-radius: 999px;

  background: #d94f79;

  color: white;

  font-weight: bold;

  cursor: pointer;
}

.verdict {
  min-height: 60px;

  margin-top: 25px;

  color: #ffabc0;

  font-family: Georgia, serif;

  font-size: 23px;
}

.back {
  display: inline-block;

  margin-top: 30px;

  color: white;

  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

<h1>
⚖️ Court of Love
</h1>

<p>
The case of <strong>Riti vs. Being Way Too Adorable</strong>
</p>


<div class="court">

<div class="gavel">
🔨
</div>

<h2>
The Court Is Now In Session
</h2>


<div class="charge">

<strong>Charge #1</strong>

<br><br>

Being unnecessarily adorable.
</div>


<div class="charge">

<strong>Charge #2</strong>

<br><br>

Making people smile without permission.
</div>


<div class="charge">

<strong>Charge #3</strong>

<br><br>

Looking suspiciously good at 18.
</div>


<div class="charge">

<strong>Charge #4</strong>

<br><br>

Being someone's favorite person.
</div>


<button onclick="verdict()">
⚖️ Deliver The Verdict
</button>


<div id="verdict" class="verdict">
</div>

</div>


<a href="mini-games.html" class="back">
← Back to Mini Games
</a>

</div>


<script>

function verdict() {

document.getElementById("verdict")
.innerHTML =
"👩‍⚖️ VERDICT: GUILTY.<br><br>" +
"Sentence: One lifetime supply of love, hugs, " +
"cake and birthday wishes. ❤️";

}

</script>

</body>

</html>
