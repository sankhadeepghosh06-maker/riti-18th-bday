<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Court of Love ⚖️</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% 20%,rgba(160,80,255,.15),transparent 40%),
#100818;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:30px 18px;
}

.back {
display:block;
color:#c5b0ca;
font-size:11px;
text-decoration:none;
margin-bottom:50px;
}

.court {
max-width:550px;
margin:auto;
}

.gavel {
font-size:55px;
}

h1 {
font-family:Georgia,serif;
font-size:52px;
font-weight:400;
}

.subtitle {
color:#c5b0ca;
font-size:12px;
line-height:1.7;
}

.case {
margin-top:40px;
padding:30px 22px;
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
background:rgba(255,255,255,.04);
}

.case-title {
color:#ffb5dc;
font-size:9px;
letter-spacing:3px;
}

.allegation {
font-family:Georgia,serif;
font-size:26px;
line-height:1.4;
margin:25px 0;
}

button {
margin:6px;
padding:12px 20px;
border-radius:999px;
border:1px solid rgba(255,170,220,.3);
background:rgba(255,255,255,.05);
color:white;
cursor:pointer;
}

.verdict {
margin-top:30px;
font-family:Georgia,serif;
font-size:25px;
color:#ffb5dc;
min-height:40px;
}

</style>

</head>

<body>

<a href="mini-games.html" class="back">
← back to the games
</a>

<div class="court">

<div class="gavel">⚖️</div>

<h1>
The Court<br>
of Love
</h1>

<p class="subtitle">
The people vs. Riti.<br>
The charges are serious.
</p>

<div class="case">

<div class="case-title">
CASE #018 · THE PEOPLE VS RITI
</div>

<div class="allegation">
“Being dangerously adorable
without a permit.”
</div>

<button onclick="verdict('guilty')">
Guilty
</button>

<button onclick="verdict('innocent')">
Innocent
</button>

<div class="verdict" id="verdict"></div>

</div>

</div>

<script>

function verdict(choice) {

const output =
document.getElementById("verdict");

if(choice === "guilty") {

output.innerHTML =
"VERDICT: GUILTY. 💗<br><small>sentence: unlimited affection.</small>";

} else {

output.innerHTML =
"VERDICT: suspiciously guilty. 💜<br><small>nice try though.</small>";

}

}

</script>

</body>
</html>
