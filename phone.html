<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fake Phone 📱</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;
background:#100818;
color:white;
font-family:Arial,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
padding:30px 20px;
}

.back {
align-self:flex-start;
color:#c7b1cb;
text-decoration:none;
font-size:11px;
margin-bottom:30px;
}

.phone {
width:min(100%,330px);
height:620px;

border:7px solid #29202e;
border-radius:42px;

background:#0e0a12;

box-shadow:
0 30px 80px rgba(0,0,0,.5),
0 0 50px rgba(170,80,255,.08);

overflow:hidden;
}

.top {
height:40px;
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
color:#999;
}

.screen {
padding:25px 18px;
}

.contact {
text-align:center;
margin-bottom:30px;
}

.avatar {
width:60px;
height:60px;
margin:auto;
display:grid;
place-items:center;
border-radius:50%;
background:linear-gradient(135deg,#ff79b9,#986cff);
font-size:25px;
}

.contact h2 {
font-family:Georgia,serif;
font-weight:400;
margin:10px 0 3px;
}

.contact p {
font-size:9px;
color:#777;
}

.message {
max-width:230px;
padding:12px 15px;
border-radius:17px 17px 17px 5px;
background:#25202a;
font-size:11px;
line-height:1.6;
margin-bottom:12px;
}

.message.right {
margin-left:auto;
border-radius:17px 17px 5px 17px;
background:linear-gradient(135deg,#713d67,#593c78);
}

.tap {
margin-top:35px;
text-align:center;
color:#ffafd9;
font-size:10px;
cursor:pointer;
}

</style>

</head>

<body>

<a href="mini-games.html" class="back">
← back to the games
</a>

<div class="phone">

<div class="top">
9:18
</div>

<div class="screen">

<div class="contact">

<div class="avatar">♡</div>

<h2>Riti</h2>

<p>online just now</p>

</div>

<div class="message">
hey
</div>

<div class="message">
it's your birthday!!
</div>

<div class="message right">
i know 😭
</div>

<div class="message">
so...
</div>

<div class="message">
how does it feel being 18?
</div>

<div class="message right">
honestly?
</div>

<div class="message right">
kinda iconic.
</div>

<div class="message">
correct answer.
</div>

<div class="tap" onclick="reveal()">
tap for one more message ✦
</div>

<div id="extra"></div>

</div>

</div>

<script>

function reveal() {

document.getElementById("extra").innerHTML =
`
<div class="message" style="margin-top:20px;">
also... you're very loved. just thought you should know. ♡
</div>
`;

}

</script>

</body>
</html>
