<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Tiny Phone 📱</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  padding: 25px 15px;

  background: #080509;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;
}

h1 {
  font-family: Georgia, serif;
}

.phone {
  width: 310px;
  max-width: 90vw;

  height: 600px;

  margin: 25px auto;

  padding: 12px;

  border-radius: 40px;

  background: #161016;

  border: 3px solid #555;

  box-shadow:
    0 20px 60px rgba(0,0,0,.6);
}

.screen {
  height: 100%;

  border-radius: 30px;

  overflow: hidden;

  background:
    linear-gradient(
      150deg,
      #431525,
      #130910
    );

  padding: 20px;
}

.time {
  font-size: 46px;

  margin-top: 20px;
}

.date {
  color: #ddb5c2;

  margin-bottom: 40px;
}

.apps {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;
}

.app {
  padding: 10px;

  border-radius: 15px;

  background: rgba(255,255,255,.08);

  cursor: pointer;

  font-size: 28px;
}

.app small {
  display: block;

  font-size: 10px;

  margin-top: 5px;
}

#popup {
  display: none;

  margin-top: 30px;

  padding: 18px;

  border-radius: 18px;

  background: rgba(255,255,255,.1);

  color: #ffb2c5;

  line-height: 1.5;
}

.close {
  margin-top: 12px;

  border: none;

  border-radius: 999px;

  padding: 8px 15px;

  background: #d94f79;

  color: white;
}

.back {
  color: white;

  text-decoration: none;
}

</style>

</head>

<body>

<h1>
📱 Tiny Phone
</h1>

<p>
Definitely not a real phone. Just a tiny fictional one. ❤️
</p>


<div class="phone">

<div class="screen">

<div class="time" id="time">
18:00
</div>

<div class="date">
September 5
</div>


<div class="apps">

<div class="app" onclick="openApp('messages')">
💬
<small>Messages</small>
</div>

<div class="app" onclick="openApp('photos')">
📸
<small>Photos</small>
</div>

<div class="app" onclick="openApp('notes')">
📝
<small>Notes</small>
</div>

<div class="app" onclick="openApp('music')">
🎵
<small>Music</small>
</div>

<div class="app" onclick="openApp('heart')">
❤️
<small>Secret</small>
</div>

<div class="app" onclick="openApp('camera')">
📷
<small>Camera</small>
</div>

</div>


<div id="popup">

<div id="popupText"></div>

<button
  class="close"
  onclick="closeApp()"
>
Close
</button>

</div>

</div>

</div>


<a href="mini-games.html" class="back">
← Back to Mini Games
</a>


<script>

const content = {

messages:
"💬 Mom: Happy birthday! ❤️<br><br>💌 Someone: I hope you know how loved you are.",

photos:
"📸 There are 847 imaginary photos here.<br><br>Unfortunately the tiny phone has run out of storage. 😂",

notes:
"📝 Note to self:<br><br>Buy cake.<br>Take pictures.<br>Make Riti smile.<br>Repeat.",

music:
"🎵 Currently playing:<br><br>The song that reminds someone of you. ❤️",

heart:
"❤️ SECRET MESSAGE<br><br>You are someone's favorite person.",

camera:
"📷 Camera opened.<br><br>Smile!<br><br>✨ *click*"

};


function openApp(app) {

document.getElementById("popupText")
.innerHTML = content[app];

document.getElementById("popup")
.style.display = "block";

}


function closeApp() {

document.getElementById("popup")
.style.display = "none";

}

</script>

</body>

</html>
