<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Bouquet Builder 🌹</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      rgba(255, 90, 145, .2),
      transparent 45%
    ),
    #09050a;

  color: white;

  font-family: Arial, sans-serif;

  padding: 25px 15px 50px;
}

.container {
  width: 100%;
  max-width: 700px;

  margin: auto;

  text-align: center;
}

h1 {
  font-family: Georgia, serif;

  font-size: clamp(40px, 10vw, 65px);

  margin-bottom: 8px;
}

.subtitle {
  color: #dcb6c2;

  margin-bottom: 30px;
}

.panel {
  padding: 25px;

  border-radius: 25px;

  background: rgba(255,255,255,.05);

  border: 1px solid rgba(255,180,200,.15);
}

h2 {
  font-family: Georgia, serif;
}

.options {
  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 10px;
}

.option {
  border: 1px solid rgba(255,180,200,.3);

  background: rgba(255,255,255,.05);

  color: white;

  padding: 12px 16px;

  border-radius: 999px;

  cursor: pointer;

  font-size: 15px;
}

.option.selected {
  background: #d94f79;

  border-color: #ff8eae;
}

.bouquet {
  min-height: 300px;

  margin: 30px 0;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  font-size: 45px;
}

.flowers {
  min-height: 90px;

  font-size: 48px;

  letter-spacing: -8px;
}

.stems {
  width: 12px;

  height: 110px;

  background: #4c8a55;

  border-radius: 10px;
}

.ribbon {
  margin-top: -10px;

  font-size: 35px;
}

button.main {
  border: none;

  background: linear-gradient(
    135deg,
    #ff719b,
    #d94f79
  );

  color: white;

  padding: 15px 25px;

  border-radius: 999px;

  font-weight: bold;

  cursor: pointer;
}

.message {
  margin-top: 20px;

  font-family: Georgia, serif;

  font-size: 22px;

  color: #ffabc0;
}

.back {
  display: inline-block;

  margin-top: 30px;

  color: white;

  text-decoration: none;
}

</style>

</head>

<body>

<div class="container">

<h1>🌹 Bouquet Builder</h1>

<p class="subtitle">
Build the bouquet you deserve.
</p>

<div class="panel">

<h2>Choose your flowers</h2>

<div class="options">

<button class="option flower" data-flower="🌹">
🌹 Roses
</button>

<button class="option flower" data-flower="🌷">
🌷 Tulips
</button>

<button class="option flower" data-flower="🌸">
🌸 Blossoms
</button>

<button class="option flower" data-flower="🌻">
🌻 Sunflowers
</button>

</div>


<h2>Choose your ribbon</h2>

<div class="options">

<button class="option ribbon-choice" data-ribbon="🎀">
🎀 Pink
</button>

<button class="option ribbon-choice" data-ribbon="🤍">
🤍 White
</button>

<button class="option ribbon-choice" data-ribbon="💗">
💗 Heart
</button>

</div>


<div class="bouquet">

<div id="flowers" class="flowers">
🌹🌹🌹
</div>

<div class="stems"></div>

<div id="ribbon" class="ribbon">
🎀
</div>

</div>


<button class="main" onclick="finishBouquet()">
✨ Finish My Bouquet
</button>

<div id="message" class="message"></div>

</div>

<a href="mini-games.html" class="back">
← Back to Mini Games
</a>

</div>


<script>

let flower = "🌹";
let ribbon = "🎀";

const flowerButtons =
document.querySelectorAll(".flower");

const ribbonButtons =
document.querySelectorAll(".ribbon-choice");

flowerButtons.forEach(button => {

  button.addEventListener("click", () => {

    flower =
      button.dataset.flower;

    flowerButtons.forEach(b =>
      b.classList.remove("selected")
    );

    button.classList.add("selected");

    updateBouquet();

  });

});


ribbonButtons.forEach(button => {

  button.addEventListener("click", () => {

    ribbon =
      button.dataset.ribbon;

    ribbonButtons.forEach(b =>
      b.classList.remove("selected")
    );

    button.classList.add("selected");

    updateBouquet();

  });

});


function updateBouquet() {

  document.getElementById("flowers").textContent =
    flower + flower + flower + flower + flower;

  document.getElementById("ribbon").textContent =
    ribbon;

}


function finishBouquet() {

  document.getElementById("message").textContent =
    "This bouquet is officially yours. 🌷❤️";

}

</script>

</body>

</html>
