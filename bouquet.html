<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bouquet Builder 🌹</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>

    :root {
      --bg:#100818;
      --pink:#ff72b6;
      --pink2:#ffb6dc;
      --purple:#a579ff;
      --white:#fff8fd;
      --muted:#c4aec8;
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 20%,rgba(170,80,255,.15),transparent 35%),
        #100818;
      color:var(--white);
      font-family:"DM Sans",sans-serif;
      text-align:center;
      padding:35px 18px;
    }

    .back {
      display:block;
      width:max-content;
      margin:0 auto 45px;
      color:var(--muted);
      text-decoration:none;
      font-size:11px;
    }

    h1 {
      font-family:"Cormorant Garamond",serif;
      font-size:60px;
      font-weight:500;
    }

    .script {
      display:block;
      font-family:"Great Vibes",cursive;
      color:var(--pink2);
      font-size:34px;
    }

    .intro {
      max-width:350px;
      margin:18px auto 30px;
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
    }

    .bouquet {
      position:relative;
      width:280px;
      height:350px;
      margin:20px auto;
    }

    .flower {
      position:absolute;
      font-size:48px;
      cursor:pointer;
      transition:.3s;
      user-select:none;
      filter:drop-shadow(0 5px 15px rgba(255,80,180,.15));
    }

    .flower:hover {
      transform:scale(1.18) rotate(5deg);
    }

    .f1 { left:30px; top:65px; }
    .f2 { left:110px; top:20px; }
    .f3 { right:25px; top:70px; }
    .f4 { left:65px; top:120px; }
    .f5 { right:65px; top:125px; }

    .stems {
      position:absolute;
      left:50%;
      top:135px;
      width:4px;
      height:180px;
      transform:translateX(-50%);
      background:#6c965f;
      border-radius:10px;
      box-shadow:
        -35px 20px #6c965f,
        35px 20px #6c965f,
        -55px 50px #6c965f,
        55px 50px #6c965f;
      opacity:.7;
    }

    .ribbon {
      position:absolute;
      bottom:25px;
      left:50%;
      transform:translateX(-50%);
      padding:8px 25px;
      border-radius:20px;
      background:linear-gradient(90deg,#ff69ad,#9b6aff);
      font-size:10px;
      letter-spacing:1px;
    }

    .result {
      min-height:35px;
      color:var(--pink2);
      font-family:"Great Vibes",cursive;
      font-size:27px;
      margin:15px;
    }

    button {
      border:1px solid rgba(255,170,220,.3);
      background:rgba(255,255,255,.05);
      color:white;
      border-radius:999px;
      padding:13px 24px;
      cursor:pointer;
    }

  </style>
</head>

<body>

  <a href="mini-games.html" class="back">← back to the games</a>

  <h1>
    Bouquet
    <span class="script">for you ♡</span>
  </h1>

  <p class="intro">
    Tap the flowers to arrange your own little bouquet.
    Because apparently buying a real one wasn't enough.
  </p>

  <div class="bouquet">

    <div class="stems"></div>

    <div class="flower f1" onclick="flower('🌹')">🌹</div>
    <div class="flower f2" onclick="flower('🌷')">🌷</div>
    <div class="flower f3" onclick="flower('🌸')">🌸</div>
    <div class="flower f4" onclick="flower('🌺')">🌺</div>
    <div class="flower f5" onclick="flower('🌻')">🌻</div>

    <div class="ribbon">FOR RITI</div>

  </div>

  <div class="result" id="result">
    choose a flower ♡
  </div>

  <button onclick="finish()">
    finish my bouquet
  </button>

  <script>

    let flowers = [];

    function flower(type) {

      flowers.push(type);

      document.getElementById("result").textContent =
        flowers.join(" ") + " ♡";

    }

    function finish() {

      document.getElementById("result").textContent =
        "A bouquet made with love. 🌷💗";

    }

  </script>

</body>
</html>
